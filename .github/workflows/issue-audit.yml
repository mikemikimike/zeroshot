name: Issue audit

on:
  issues:
    types: [opened, reopened, edited, labeled]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: issue-audit-${{ github.event.issue.number }}

jobs:
  audit:
    name: audit
    # Opt in with the ISSUE_AUDIT_ENABLED repository variable once the token secret exists.
    if: >-
      ${{ vars.ISSUE_AUDIT_ENABLED == 'true' && !github.event.issue.pull_request &&
      github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Audit issue
        uses: ./.github/actions/issue-audit
        with:
          checkout: 'false'
          claude-code-oauth-token: ${{ secrets.ISSUE_AUDIT_CLAUDE_CODE_OAUTH_TOKEN }}
