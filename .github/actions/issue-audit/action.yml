name: Zeroshot issue audit
description: >-
  Audit GitHub issues for implementation readiness with Claude Code or Codex, then label the issue
  and ask the reporter focused questions with suggested defaults.
author: The Open Engine Company

inputs:
  github-token:
    description: Token for the deterministic decide and publish steps. Never reaches the agent.
    default: ${{ github.token }}
  harness:
    description: Agent harness, `claude-code` or `codex`.
    default: claude-code
  model:
    description: Optional model identifier, passed to the harness unchanged.
    default: ''
  claude-code-oauth-token:
    description: Claude Code OAuth token. Use this or `anthropic-api-key` with `claude-code`.
    default: ''
  anthropic-api-key:
    description: Anthropic API key. Use this or `claude-code-oauth-token` with `claude-code`.
    default: ''
  openai-api-key:
    description: OpenAI API key, required with `codex`.
    default: ''
  claude-code-version:
    description: Exact `@anthropic-ai/claude-code` version.
    default: 2.1.276
  codex-version:
    description: Exact `@openai/codex` version.
    default: 0.155.0
  trigger-mode:
    description: '`trusted-authors`, `label` or `both`.'
    default: both
  minimum-author-role:
    description: Minimum repository role of an author whose new issue is audited automatically.
    default: write
  maintainer-role:
    description: Minimum repository role to apply the audit label or use the audit command.
    default: write
  audit-label:
    description: Label a maintainer applies to request an audit.
    default: audit
  ready-label:
    description: Label applied when the issue is ready for implementation.
    default: ready-for-implementation
  needs-information-label:
    description: Label applied while the issue awaits answers from its author.
    default: needs-information
  command:
    description: Maintainer comment command that requests a new audit, even after the round cap.
    default: /audit
  max-rounds:
    description: Maximum automatic audit rounds before a maintainer must restart.
    default: '3'
  max-questions:
    description: Maximum questions per needs-information verdict.
    default: '3'
  timeout-minutes:
    description: Wall-clock limit for the agent.
    default: '10'
  max-turns:
    description: Maximum Claude Code agent turns.
    default: '30'
  max-budget-usd:
    description: Maximum Claude Code spend per audit in US dollars.
    default: '1'

outputs:
  audited:
    description: '`true` when the event started an audit.'
    value: ${{ steps.decide.outputs.audit }}
  reason:
    description: Why the event did or did not start an audit.
    value: ${{ steps.decide.outputs.reason }}
  round:
    description: Audit round number, or `0` without an audit.
    value: ${{ steps.decide.outputs.round }}
  verdict:
    description: '`ready` or `needs-information` after a published audit.'
    value: ${{ steps.publish.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version: 22

    - name: Decide whether to audit
      id: decide
      shell: bash
      env:
        ISSUE_AUDIT_WORKDIR: ${{ runner.temp }}/zeroshot-issue-audit
        ISSUE_AUDIT_GITHUB_TOKEN: ${{ inputs.github-token }}
        ISSUE_AUDIT_HARNESS: ${{ inputs.harness }}
        ISSUE_AUDIT_MODEL: ${{ inputs.model }}
        ISSUE_AUDIT_CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        ISSUE_AUDIT_CODEX_VERSION: ${{ inputs.codex-version }}
        ISSUE_AUDIT_TRIGGER_MODE: ${{ inputs.trigger-mode }}
        ISSUE_AUDIT_MINIMUM_AUTHOR_ROLE: ${{ inputs.minimum-author-role }}
        ISSUE_AUDIT_MAINTAINER_ROLE: ${{ inputs.maintainer-role }}
        ISSUE_AUDIT_AUDIT_LABEL: ${{ inputs.audit-label }}
        ISSUE_AUDIT_READY_LABEL: ${{ inputs.ready-label }}
        ISSUE_AUDIT_NEEDS_INFORMATION_LABEL: ${{ inputs.needs-information-label }}
        ISSUE_AUDIT_COMMAND: ${{ inputs.command }}
        ISSUE_AUDIT_MAX_ROUNDS: ${{ inputs.max-rounds }}
        ISSUE_AUDIT_MAX_QUESTIONS: ${{ inputs.max-questions }}
        ISSUE_AUDIT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        ISSUE_AUDIT_MAX_TURNS: ${{ inputs.max-turns }}
        ISSUE_AUDIT_MAX_BUDGET_USD: ${{ inputs.max-budget-usd }}
      run: |
        set -euo pipefail
        rm -rf -- "$ISSUE_AUDIT_WORKDIR"
        install -d -m 0700 -- "$ISSUE_AUDIT_WORKDIR"
        node "$GITHUB_ACTION_PATH/decide.js"

    - name: Check out repository without credentials
      if: ${{ steps.decide.outputs.audit == 'true' }}
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: .zeroshot-issue-audit/repository
        persist-credentials: false
        fetch-depth: 1

    - name: Install harness
      if: ${{ steps.decide.outputs.audit == 'true' }}
      shell: bash
      env:
        ISSUE_AUDIT_WORKDIR: ${{ runner.temp }}/zeroshot-issue-audit
      run: node "$GITHUB_ACTION_PATH/install.js"

    - name: Run read-only audit agent
      if: ${{ steps.decide.outputs.audit == 'true' }}
      shell: bash
      env:
        ISSUE_AUDIT_WORKDIR: ${{ runner.temp }}/zeroshot-issue-audit
        ISSUE_AUDIT_CHECKOUT: ${{ github.workspace }}/.zeroshot-issue-audit/repository
        ISSUE_AUDIT_CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        ISSUE_AUDIT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        ISSUE_AUDIT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
      run: |
        set -euo pipefail
        chmod -R a-w -- "$ISSUE_AUDIT_CHECKOUT"
        node "$GITHUB_ACTION_PATH/audit.js"

    - name: Restore checkout permissions
      if: ${{ always() && steps.decide.outputs.audit == 'true' }}
      shell: bash
      env:
        ISSUE_AUDIT_CHECKOUT: ${{ github.workspace }}/.zeroshot-issue-audit/repository
      run: |
        if [[ -d "$ISSUE_AUDIT_CHECKOUT" ]]; then chmod -R u+w -- "$ISSUE_AUDIT_CHECKOUT"; fi

    - name: Publish verdict
      id: publish
      if: ${{ steps.decide.outputs.audit == 'true' }}
      shell: bash
      env:
        ISSUE_AUDIT_WORKDIR: ${{ runner.temp }}/zeroshot-issue-audit
        ISSUE_AUDIT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/publish.js"
