name: Zeroshot issue audit
description: >-
  Audits GitHub issues with Claude Code or Codex, then labels each one ready for implementation or
  asks the reporter a few focused questions.
author: The Open Engine Company

inputs:
  harness:
    description: Coding agent that performs the audit, claude or codex.
    default: claude
  model:
    description: Optional model passed unchanged to the harness.
    default: ''
  claude-code-oauth-token:
    description: Claude Code OAuth token (from `claude setup-token`), for harness claude.
    default: ''
  anthropic-api-key:
    description: Anthropic API key, for harness claude when no OAuth token is set.
    default: ''
  openai-api-key:
    description: OpenAI API key, for harness codex.
    default: ''
  trigger:
    description: >-
      Which issues are audited. trusted audits issues opened by authors with min-permission;
      label waits for a maintainer to apply audit-label; trusted-or-label does both.
    default: trusted-or-label
  min-permission:
    description: Repository role required of trusted authors and command senders.
    default: write
  audit-label:
    description: Label a maintainer applies to accept an issue for auditing.
    default: audit
  ready-label:
    description: Label applied when the issue is ready for implementation.
    default: ready
  needs-info-label:
    description: Label applied while the audit is waiting for answers.
    default: needs-info
  command:
    description: Comment command that lets a maintainer request a new audit.
    default: /audit
  max-rounds:
    description: Automatic follow-up rounds before only a maintainer can restart the audit.
    default: '3'
  max-questions:
    description: Questions asked per round.
    default: '3'
  max-budget-usd:
    description: Spending limit per audit in USD, enforced by Claude Code.
    default: '1'
  timeout-minutes:
    description: Time limit for the agent in minutes.
    default: '10'
  checkout:
    description: Check out the repository read-only before the audit. Set false if already done.
    default: 'true'
  github-token:
    description: Token used to read the issue, label it and comment. Never given to the agent.
    default: ${{ github.token }}
  claude-code-version:
    description: '@anthropic-ai/claude-code version.'
    default: 2.1.276
  codex-version:
    description: '@openai/codex version.'
    default: 0.155.0

outputs:
  ran:
    description: Whether this event produced an audit.
    value: ${{ steps.gate.outputs.run }}

runs:
  using: composite
  steps:
    - name: Decide whether to audit
      id: gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        AUDIT_TRIGGER: ${{ inputs.trigger }}
        AUDIT_MIN_PERMISSION: ${{ inputs.min-permission }}
        AUDIT_LABEL: ${{ inputs.audit-label }}
        AUDIT_READY_LABEL: ${{ inputs.ready-label }}
        AUDIT_NEEDS_INFO_LABEL: ${{ inputs.needs-info-label }}
        AUDIT_COMMAND: ${{ inputs.command }}
        AUDIT_MAX_ROUNDS: ${{ inputs.max-rounds }}
        AUDIT_MAX_QUESTIONS: ${{ inputs.max-questions }}
      run: node "$GITHUB_ACTION_PATH/gate.js"

    - name: Check out repository
      if: steps.gate.outputs.run == 'true' && inputs.checkout == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Prepare audit
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        AUDIT_HARNESS: ${{ inputs.harness }}
        AUDIT_HAS_CLAUDE_AUTH: ${{ inputs.claude-code-oauth-token != '' || inputs.anthropic-api-key != '' }}
        AUDIT_HAS_CODEX_AUTH: ${{ inputs.openai-api-key != '' }}
        AUDIT_TRIGGER: ${{ inputs.trigger }}
        AUDIT_MIN_PERMISSION: ${{ inputs.min-permission }}
        AUDIT_LABEL: ${{ inputs.audit-label }}
        AUDIT_READY_LABEL: ${{ inputs.ready-label }}
        AUDIT_NEEDS_INFO_LABEL: ${{ inputs.needs-info-label }}
        AUDIT_COMMAND: ${{ inputs.command }}
        AUDIT_MAX_ROUNDS: ${{ inputs.max-rounds }}
        AUDIT_MAX_QUESTIONS: ${{ inputs.max-questions }}
        AUDIT_ROUND: ${{ steps.gate.outputs.round }}
      run: |
        set -euo pipefail
        case "$AUDIT_HARNESS" in
          claude) [ "$AUDIT_HAS_CLAUDE_AUTH" = true ] || { echo "::error::harness claude needs claude-code-oauth-token or anthropic-api-key"; exit 1; } ;;
          codex) [ "$AUDIT_HAS_CODEX_AUTH" = true ] || { echo "::error::harness codex needs openai-api-key"; exit 1; } ;;
          *) echo "::error::harness must be claude or codex"; exit 1 ;;
        esac
        work="$RUNNER_TEMP/issue-audit"
        rm -rf "$work"
        install -d -m 700 "$work"
        AUDIT_PROMPT_FILE="$work/prompt.md" node "$GITHUB_ACTION_PATH/context.js"

    - name: Install harness
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AUDIT_HARNESS: ${{ inputs.harness }}
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: |
        set -euo pipefail
        if [ "$AUDIT_HARNESS" = claude ]; then package="@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
        else package="@openai/codex@$CODEX_VERSION"; fi
        npm install --global --prefix "$RUNNER_TEMP/issue-audit/harness" --no-audit --no-fund "$package"

    - name: Run audit agent
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        AUDIT_HARNESS: ${{ inputs.harness }}
        AUDIT_MODEL: ${{ inputs.model }}
        AUDIT_BUDGET: ${{ inputs.max-budget-usd }}
        AUDIT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
      run: bash "$GITHUB_ACTION_PATH/run-agent.sh"

    - name: Publish verdict
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        AUDIT_HARNESS: ${{ inputs.harness }}
        AUDIT_RESULT_FILE: ${{ runner.temp }}/issue-audit/result.json
        AUDIT_ROUND: ${{ steps.gate.outputs.round }}
        AUDIT_TRIGGER: ${{ inputs.trigger }}
        AUDIT_MIN_PERMISSION: ${{ inputs.min-permission }}
        AUDIT_LABEL: ${{ inputs.audit-label }}
        AUDIT_READY_LABEL: ${{ inputs.ready-label }}
        AUDIT_NEEDS_INFO_LABEL: ${{ inputs.needs-info-label }}
        AUDIT_COMMAND: ${{ inputs.command }}
        AUDIT_MAX_ROUNDS: ${{ inputs.max-rounds }}
        AUDIT_MAX_QUESTIONS: ${{ inputs.max-questions }}
      run: node "$GITHUB_ACTION_PATH/publish.js"
